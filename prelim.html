<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT CP12</title>
    <link rel="stylesheet" href="sem.css">
    
    <script>
        function calculate() {
            
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let operation = document.getElementById('operation').value;
            let result;

            
            switch (operation) {
                case 'addition':
                    result = "Sum: " + (num1 + num2);
                    break;
                case 'subtraction':
                    result = "Difference: " + (num1 - num2);
                    break;
                case 'multiplication':
                    result = "Product: " + (num1 * num2);
                    break;
                case 'division':
                    if (num2 !== 0) {
                        result = "Quotient: " + (num1 / num2);
                    } else {
                        result = "Cannot divide by zero.";
                    }
                    break;
                default:
                    result = "Please select a valid operation.";
            }

            // Display the result
            document.getElementById('result').textContent = result;
        }
    </script>
</head>
<body>
    
     
  <center>
<h1>PRELIM</h1>

  <div id="helloworld">
<button class=hw ><a href="hello.html">Hello World</a></button>
</div>

<div class="calculator">
<h3>Calculator</h3>
    
    <p>Enter two numbers:</p>
    
    <input type="number" id="num1" placeholder="Enter a number">
    <input type="number" id="num2" placeholder="Enter another number">
    <div>
    <br>
    <select id="operation">
        <option value="">Select an Operator</option>
        <br>
        <option value="addition">Addition</option>
        <option value="subtraction">Subtraction</option>
        <option value="multiplication">Multiplication</option>
        <option value="division">Division</option>
    </select>
    
    <button onclick="calculate()">Calculate</button>

  
    <p id="result"></p>

</div>
</div>

<br>
<button><a href="choose.html">Back to Home</a></button>
  </center>
</body>

</html>
